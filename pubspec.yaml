name: finclar_ai
description: Finclar AI - Smart Finance Tracking with AI, Chat, and Group Budgeting.
publish_to: 'none'
version: 1.5.0+47

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Local Database
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Secure Storage
  flutter_secure_storage: ^10.0.0

  # Shared Preferences
  shared_preferences: ^2.3.3

  # Logging
  logger: ^2.4.0

  # Icons
  remixicon: ^1.0.1

  # SVG
  flutter_svg: ^2.0.10+1

  # Generated profile avatars — our own Flutter port of react-nice-avatar.
  # Pinned to a tag so a push to main can't change avatars under us.
  nice_avatar:
    git:
      url: https://github.com/Brain-codes/nice_avatar.git
      ref: v1.1.1

  # Data Classes
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Biometric Auth
  local_auth: ^2.3.0

  # Push Notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6

  # Analytics & Crash Reporting
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3

  # Social Auth
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3

  # Forms
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.0.0

  # Image / receipt capture
  image_picker: ^1.1.2
  image: ^4.8.0
  cached_network_image: ^3.4.1

  # Bank linking (Mono Connect)
  mono_flutter: ^4.0.4

  # Realtime group chat (WebSocket)
  web_socket_channel: ^3.0.1

  # Charts
  fl_chart: ^0.69.0

  # Formatting
  intl: ^0.20.0

  # URL launching
  url_launcher: ^6.3.0

  # Toast notifications
  toastification: ^2.3.0

  # Utilities
  equatable: ^2.0.5
  webview_flutter: ^4.14.1
  share_plus: ^13.3.0
  app_links: ^7.0.0
  showcaseview: ^5.1.0

  # Home screen widgets (via HomeWidgetService wrapper only)
  home_widget: ^0.7.0

  # Audio playback (via AudioService wrapper only)
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.21.0

  # App Icon & Native Splash
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter:
  config:
    enable-lldb-debugging: false
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/gamification/
    - assets/images/gamification/badges/
    - assets/images/wrapped/
    - assets/images/wrapped/category/
    - assets/audio/
    - assets/icons/
    - assets/logo/
    - assets/svg/
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
        - asset: assets/fonts/Geist-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: false

flutter_native_splash:
  background_image: assets/logo/splash-light-bg.png
  background_image_dark: assets/logo/splash-dark-bg.png
  android_12:
    background_image: assets/logo/splash-light-bg.png
    background_image_dark: assets/logo/splash-dark-bg.png
  ios: true
  android: true
  web: false
  fullscreen: false

