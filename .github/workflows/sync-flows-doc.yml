name: Sync flow guide to Google Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/FLOWS.md'
      - 'scripts/sync_flows_to_gdoc.py'
      - '.github/workflows/sync-flows-doc.yml'
  workflow_dispatch:

concurrency:
  group: sync-flows-doc
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --quiet markdown google-api-python-client google-auth

      - name: Push docs/FLOWS.md to the Google Doc
        env:
          GOOGLE_DOC_ID: ${{ vars.GOOGLE_DOC_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_flows_to_gdoc.py
